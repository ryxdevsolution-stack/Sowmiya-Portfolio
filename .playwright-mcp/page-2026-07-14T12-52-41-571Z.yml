            - paragraph [ref=e118]: I'm Sowmiya, a designer working across brand identity, print and digital product from Tirupur, Tamil Nadu.
            - paragraph [ref=e119]: I started in textile and embroidery design, digitising artwork for machines that stitch it in thread. That work has an unforgiving feedback loop — if the file is wrong, the fabric shows it, and the run is wasted. It taught me to resolve a design fully before it leaves my hands.
            - paragraph [ref=e120]: I carried that into print, where bleed and separation decide whether a job survives the press, and then into interfaces, where the same discipline shows up as consistent spacing, honest hierarchy and components that hold together under real content.
          - blockquote [ref=e122]:
            - paragraph [ref=e123]: Decoration is what you add when the design isn't working. I'd rather fix the design.
