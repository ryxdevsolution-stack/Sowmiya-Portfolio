        - generic [ref=e145]: "02"
        - heading "About" [level=2] [ref=e146]
      - paragraph [ref=e148]: I design for three surfaces that punish mistakes differently — the press, the shelf, and the screen.
      - generic [ref=e150]:
        - paragraph [ref=e151]: I'm Sowmiya, a designer working out of Tirupur, Tamil Nadu, mostly for manufacturers, schools and small retail brands.
        - paragraph [ref=e152]: I started in textile and embroidery design, digitising artwork for machines that stitch it in thread. That work has an unforgiving feedback loop — if the file is wrong, the fabric shows it and the run is wasted. It taught me to resolve a design completely before it leaves my hands.
        - paragraph [ref=e153]: I carried that into print and packaging, where bleed, trapping and separation decide whether a job survives the press, and where a food label has to earn its shelf appeal in whatever space the mandatory marks leave behind. The same discipline shows up in interface work as consistent spacing, honest hierarchy, and components that hold together under real content.
        - paragraph [ref=e154]: I also work the client side of the desk — scoping briefs, quoting jobs and coordinating orders through to delivery. Design that never gets sold stays a draft, so I treat winning the brief and keeping the client as part of the craft, not an afterthought to it.
