        - heading "About" [level=2] [ref=f10e218]
      - paragraph [ref=f10e220]: I design for three surfaces that punish mistakes differently — the press, the shelf, and the screen.
      - generic [ref=f10e222]:
        - paragraph [ref=f10e223]: I'm Sowmiya, a designer working out of Tirupur, Tamil Nadu, mostly for manufacturers, schools and small retail brands.
        - paragraph [ref=f10e224]: I started in textile and embroidery design, digitising artwork for machines that stitch it in thread. That work has an unforgiving feedback loop — if the file is wrong, the fabric shows it and the run is wasted. It taught me to resolve a design completely before it leaves my hands.
        - paragraph [ref=f10e225]: I carried that into print and packaging, where bleed, trapping and separation decide whether a job survives the press, and where a food label has to earn its shelf appeal in whatever space the mandatory marks leave behind. The same discipline shows up in interface work as consistent spacing, honest hierarchy, and components that hold together under real content.
